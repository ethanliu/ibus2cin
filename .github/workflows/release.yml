name: Build and Release Binaries

on:
  workflow_dispatch: # Allows you to manually trigger the workflow from the GitHub UI
  push:
    # tags:
    #   - 'v*.*.*'
    branches:
      - test

jobs:
  build_macos_x64:
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build macOS x86_64 App
        run: |
          pyinstaller --onedir --windowed \
                      --icon=src/icon.icns \
                      --osx-bundle-identifier "com.creativecrap.ibus2cin" \
                      --name "ibus2cin-gui-macos-x64" src/main.py

      - name: Archive macOS x86_64 App
        run: |
          cd dist
          zip -r "ibus2cin-gui-macos-x64.zip" "ibus2cin-gui-macos-x64.app"

      - name: Upload macOS x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-build
          path: dist/ibus2cin-gui-macos-x64.zip

  build_macos_arm64:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: 'arm64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build macOS arm64 App
        run: |
          pyinstaller --onedir --windowed \
                      --icon=src/icon.icns \
                      --osx-bundle-identifier "com.creativecrap.ibus2cin" \
                      --name "ibus2cin-gui-macos-arm64" src/main.py

      - name: Archive macOS arm64 App
        run: |
          cd dist
          zip -r "ibus2cin-gui-macos-arm64.zip" "ibus2cin-gui-macos-arm64.app"

      - name: Upload macOS arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-build
          path: dist/ibus2cin-gui-macos-arm64.zip

  build_windows:
    runs-on: windows-latest # This runner is x86_64 (Windows)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Windows Executable
        run: |
          pyinstaller --onefile --windowed `
                      --icon=src/icon.ico `
                      --name "ibus2cin-gui-windows" src/main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/ibus2cin-gui-windows.exe

  build_linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          architecture: 'x64'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # PyInstaller might need additional system dependencies on Linux for certain features (e.g., Tkinter)
          # For Tkinter: sudo apt-get update && sudo apt-get install -y tk-dev
          # For a basic build, this might be enough
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build Linux Executable
        run: |
          pyinstaller --onefile --windowed \
                      --name "ibus2cin-gui-linux" src/main.py
          # Note: --windowed on Linux doesn't create an .app bundle, just hides console for GUI
          # You might want to consider --console for a CLI app

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/ibus2cin-gui-linux # The executable itself, not a .zip or .app